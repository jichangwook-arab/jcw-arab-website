backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "news"
    label: "الأخبار"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "عنوان الخبر", name: "title", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "الصورة الرئيسية", name: "thumbnail", widget: "image" }
      - { label: "تفاصيل الخبر", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "معرض الصور"
    folder: "content/gallery"
    create: true
    fields:
      - { label: "وصف الصورة", name: "title", widget: "string" }
      - { label: "الفيلم / الدراما / الحدث", name: "category", widget: "string" }
      - { label: "الصورة", name: "image", widget: "image" }