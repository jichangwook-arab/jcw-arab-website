<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> الأخبار | عرب تشانغووك</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --accent-color: #c084fc;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #272735;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        header { background-color: rgba(15, 15, 19, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--accent-color); }
        nav ul { list-style: none; display: flex; gap: 25px; }
        nav ul li a { color: var(--text-muted); text-decoration: none; transition: color 0.3s; font-size: 0.95rem; }
        nav ul li a.active, nav ul li a:hover { color: var(--accent-color); }

        .page-header { text-align: center; padding: 4rem 1rem 2rem; }
        .page-header h1 { font-size: 2.2rem; color: var(--text-main); margin-bottom: 0.5rem; }
        .page-header p { color: var(--text-muted); font-size: 1rem; }

        /* حاوية فارغة ونظيفة بانتظار نشر الأخبار من الأدمن */
        .empty-news-container {
            max-width: 800px;
            margin: 2rem auto 4rem;
            padding: 0 1.5rem;
            text-align: center;
        }

        .empty-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
        }

        .empty-box h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .empty-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer { background-color: var(--bg-color); color: var(--text-muted); text-align: center; padding: 2rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Arab <span>JCW</span></div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="upcoming.html">الأعمال القادمة</a></li>
                <li><a href="news.html" class="active">الأخبار</a></li>
                <li><a href="gallery.html">المعرض</a></li>
            </ul>
        </nav>
    </header>

    <div>
        <section class="page-header">
            <h1>أخبار جي تشانغ ووك </h1>
            <p>تابع أحدث المستجدات والفعاليات لنجمنا المميز تشانغ ووك!</p>
        </section>

        <!-- مساحة فارغة للزوار، بانتظار إضافات الأدمنز عبر لوحة التحكم لاحقاً -->
        <div class="empty-news-container">
            <div class="empty-box">
                <h3>لا توجد أخبار منشورة حالياً</h3>
                <p>ترقبوا أحدث أخبار وتحديثات النجم قريباً.</p>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 | عرب جي تشانغ ووك (Arab JCW)</p>
    </footer>
</body>
</html>
